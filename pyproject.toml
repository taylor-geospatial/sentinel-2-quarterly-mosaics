[dependency-groups]
dev = [
    "boto3",
    "duckdb>=1.4",
    "rashid>=0.1.8,<0.2.0",
    "ruff>=0.17.1,<0.18",
    "stac-check",
    "ty>=0.0.90,<0.1",
]

[tool.ruff]
target-version = "py312"
respect-gitignore = false
extend-exclude = [".venv-tools", ".cache", "sources", "staging"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF100", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "Use Python 3.12 annotations directly." }

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["tools", "tests"]

[tool.ty.src]
include = ["tools", "tests", "apps/viewer/devserver.py", ".claude/hooks"]
respect-ignore-files = false
