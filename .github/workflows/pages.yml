name: pages

# Publish the time-scrub viewer to GitHub Pages. The app is static — no build,
# no bundler, no server — and it reads the PUBLISHED catalog by default, so the
# hosted copy is the checked-in directory with nothing configured. A local tree
# is still one query parameter away; see apps/viewer/devserver.py.

on:
  push:
    branches: [main]
    paths:
      - "apps/viewer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/viewer
      - id: deploy
        uses: actions/deploy-pages@v4
