name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Keep validators within the ranges documented in docs/conformance.md.
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      - name: Lint the tooling
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Check Python types
        run: ty check --python "$(command -v python)"

      # CI_LIGHT exempts data assets and matching PMTiles discovery links.
      # The checkout holds the metadata and not the bytes. Structural links
      # and every non-data asset still resolve. Unset it when data are local.
      - name: Catalog gates
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py
