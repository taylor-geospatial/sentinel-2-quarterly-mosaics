# micromamba env for the rails lane.
#
#     micromamba create -y -f tools/rails/environment.yml \
#         -p /u/cholmes/micromamba/envs/s2mosaics
#
# What each piece is for:
#
# * duckdb     staging the item rows and the coverage table
# * pyproj     UTM -> WGS84 for every tile footprint (tools/mgrs_grid.py)
# * shapely    the antimeridian split, and the --bbox tile filter
# * libgdal-core + gdal  the overview COGs. **The WebP driver is not
#   optional**: the published browse layer is WebP, and make_overview.py
#   falls back to JPEG with a warning when it is missing, which would
#   silently publish the wrong thing. `gdalinfo --formats | grep WEBP`
#   after creating the env.
# * rasterio   the geometry verification gate (make_items.py --verify)
#   and valid_fraction (make_coverage.py), both of which read COG
#   headers and small overviews over https
# * rio-cogeo  `rio cogeo validate` on the overview before it is
#   published. The COG driver can write a file that a strict reader
#   still rejects, so the browse layer is checked rather than assumed,
#   and the check has to live on the machine that builds it
# * tippecanoe + pmtiles  the footprints tileset
# * boto3      the uploads
#
# geoparquet-io is pinned. Both `--compression-level` and
# `--row-group-size` only reach gpio's write engine from 1.4.0 onward; on
# 1.3.0 they were accepted and dropped. An unpinned install is how a flag
# that "did nothing" quietly starts doing something very expensive.
# Install it last, on its own: its dependency tree pulls an older
# botocore than boto3 asks for, and letting pip resolve them together
# fails outright.
name: s2mosaics
channels:
  - conda-forge
dependencies:
  - python=3.12
  - duckdb>=1.4
  - pyarrow>=21
  - pyproj>=3.6
  - shapely>=2.0
  - gdal>=3.8
  - libgdal-core
  - rasterio>=1.3
  - rio-cogeo
  - numpy
  - pytz
  - tippecanoe
  - pip
  - pip:
      # boto3 is installed here rather than from conda-forge so that pip
      # resolves it together with geoparquet-io. gpio depends on s3fs,
      # which depends on aiobotocore, which pins botocore hard; a
      # conda-forge boto3 installed first is then downgraded underneath
      # and pip reports the pair as incompatible. Resolved together they
      # agree, and `pip check` is clean. Uploading is the last step of a
      # two-hour job, so it is not a place for a latent version conflict.
      - geoparquet-io==1.5.0
      - boto3
      - pmtiles
